<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yulu 小舖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Noto Sans TC', sans-serif; background: #f5f5f5; color: #333; }
        .header { background: linear-gradient(135deg, #ee4d2d, #ff7337); color: #fff; padding: 16px 24px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .header h1 { font-size: 22px; letter-spacing: 1px; white-space: nowrap; }
        .header h1 span { font-size: 14px; font-weight: normal; opacity: 0.85; margin-left: 8px; }
        .header-actions { display: flex; align-items: center; gap: 6px; }
        .header-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s; white-space: nowrap; }
        .header-btn:hover { background: rgba(255,255,255,0.35); }
        .lang-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .lang-btn.active { background: rgba(255,255,255,0.25); border-color: #fff; }
        .lang-btn:hover { background: rgba(255,255,255,0.15); }
        .cart-btn { position: relative; }
        .cart-count { background: #fdd835; color: #333; font-size: 12px; font-weight: bold; padding: 1px 7px; border-radius: 10px; position: absolute; top: -6px; right: -6px; }
        .user-info { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; }
        .user-info .avatar { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .user-info .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.5); color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.3s; }
        .user-info .logout-btn:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .banner { background: linear-gradient(135deg, #ff9a76, #fec84d); border-radius: 10px; padding: 32px 24px; margin-bottom: 20px; color: #fff; text-align: center; }
        .banner h2 { font-size: 26px; margin-bottom: 6px; }
        .banner p { font-size: 15px; opacity: 0.9; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; padding: 10px 14px; border: 2px solid #eee; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: #ee4d2d; }
        .search-bar input::placeholder { color: #bbb; }
        .search-bar .search-icon { background: #ee4d2d; color: #fff; border: none; border-radius: 6px; padding: 0 16px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        .search-bar .search-icon:hover { background: #c93f1f; }
        .search-info { font-size: 13px; color: #999; margin: -10px 0 14px; }
        .section-title { font-size: 18px; font-weight: 600; margin: 20px 0 12px; padding-left: 10px; border-left: 4px solid #ee4d2d; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
        .product-card .img-wrap { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #fff; }
        .product-info { padding: 10px 12px 14px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { color: #ee4d2d; font-size: 18px; font-weight: 700; }
        .product-price::before { content: 'NT$ '; font-size: 13px; }
        .product-sold { font-size: 12px; color: #999; margin-top: 2px; }
        .product-rating { font-size: 12px; color: #f39c12; margin-top: 2px; }
        .add-btn { display: block; width: 100%; padding: 8px; margin-top: 8px; background: #ee4d2d; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: background 0.3s; }
        .add-btn:hover { background: #c93f1f; }
        .add-btn:disabled { background: #ccc; cursor: not-allowed; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; }
        .overlay.active { display: block; }
        .panel { position: fixed; top: 0; right: -400px; width: 380px; height: 100%; background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 201; display: flex; flex-direction: column; }
        .panel.open { right: 0; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
        .panel-header h2 { font-size: 18px; }
        .panel-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .panel-close:hover { color: #333; }
        .panel-body { flex: 1; overflow-y: auto; padding: 12px 20px; }
        .cart-empty { text-align: center; padding: 60px 0; color: #bbb; }
        .cart-empty::before { content: '🛒'; font-size: 48px; display: block; margin-bottom: 12px; }
        .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .cart-item .thumb { width: 64px; height: 64px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; flex-shrink: 0; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 14px; font-weight: 500; }
        .cart-item-price { color: #ee4d2d; font-size: 15px; font-weight: 600; margin-top: 4px; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .cart-item-qty button { width: 26px; height: 26px; border: 1px solid #ddd; background: #fafafa; border-radius: 4px; cursor: pointer; font-size: 16px; line-height: 1; }
        .cart-item-qty button:hover { background: #eee; }
        .cart-item-qty span { min-width: 20px; text-align: center; font-size: 14px; }
        .cart-item-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 18px; align-self: center; }
        .cart-item-remove:hover { color: #ee4d2d; }
        .panel-footer { padding: 16px 20px; border-top: 1px solid #eee; }
        .coupon-area { display: flex; gap: 6px; margin-bottom: 12px; }
        .coupon-area input { flex: 1; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; text-transform: uppercase; }
        .coupon-area input:focus { border-color: #ee4d2d; }
        .coupon-area button { padding: 8px 12px; background: #fdd835; color: #333; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: background 0.3s; }
        .coupon-area button:hover { background: #f9ca24; }
        .coupon-applied { font-size: 12px; color: #27ae60; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .coupon-applied button { background: none; border: none; color: #ee4d2d; cursor: pointer; font-size: 12px; text-decoration: underline; }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .cart-total span:last-child { color: #ee4d2d; }
        .cart-discount { display: flex; justify-content: space-between; font-size: 13px; color: #27ae60; margin-bottom: 8px; }
        .checkout-btn { width: 100%; padding: 12px; background: #ee4d2d; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .checkout-btn:hover { background: #c93f1f; }
        .checkout-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 500; align-items: center; justify-content: center; }
        .checkout-modal.active { display: flex; }
        .checkout-box { background: #fff; border-radius: 12px; width: 640px; max-width: 92vw; max-height: 88vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.18); position: relative; padding: 28px 28px 24px; }
        .checkout-box h2 { font-size: 20px; margin-bottom: 18px; }
        .checkout-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .checkout-close:hover { color: #333; }
        .checkout-layout { display: flex; gap: 24px; flex-wrap: wrap; }
        .checkout-left { flex: 1; min-width: 240px; }
        .checkout-right { width: 260px; flex-shrink: 0; }
        .checkout-left h3 { font-size: 15px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
        .checkout-row { display: flex; gap: 10px; }
        .checkout-row .form-group { flex: 1; }
        .payment-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .payment-options label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 10px 12px; border: 1px solid #eee; border-radius: 6px; transition: border-color 0.3s; }
        .payment-options label:hover { border-color: #ccc; }
        .payment-options input:checked + span { font-weight: 600; }
        .payment-options input:checked ~ * { }
        .payment-options label:has(input:checked) { border-color: #ee4d2d; background: #fff5f2; }
        .card-fields { display: none; margin-top: 10px; padding: 14px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .card-fields.show { display: block; }
        .card-row { display: flex; gap: 10px; }
        .card-row .form-group { flex: 1; }
        .card-row .form-group input { font-family: 'Courier New', monospace; letter-spacing: 1px; }
        .checkout-summary { background: #fafafa; border-radius: 8px; padding: 14px 16px; }
        .checkout-summary .cs-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #555; }
        .checkout-summary .cs-row.cs-total { font-size: 17px; font-weight: 700; color: #ee4d2d; border-top: 1px solid #eee; padding-top: 8px; margin-top: 6px; }
        .checkout-summary .cs-row.cs-discount { color: #27ae60; }
        .checkout-summary .cs-items { font-size: 13px; color: #888; margin-bottom: 10px; }
        .place-order-btn { width: 100%; padding: 13px; background: #ee4d2d; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-top: 14px; }
        .place-order-btn:hover { background: #c93f1f; }
        .order-confirm { text-align: center; padding: 30px 20px; }
        .order-confirm .oc-icon { font-size: 56px; margin-bottom: 12px; }
        .order-confirm h2 { font-size: 22px; margin-bottom: 6px; }
        .order-confirm p { color: #888; font-size: 14px; margin-bottom: 4px; }
        .order-confirm .oc-details { text-align: left; background: #fafafa; border-radius: 8px; padding: 14px 18px; margin: 16px 0; font-size: 13px; line-height: 1.8; }
        .order-confirm .oc-details span { color: #555; }
        .order-confirm .oc-btn { padding: 11px 28px; background: #ee4d2d; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.3s; }
        .order-confirm .oc-btn:hover { background: #c93f1f; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 400; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: #fff; border-radius: 10px; padding: 28px 24px; width: 360px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,0.15); position: relative; }
        .modal-box h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .modal-close:hover { color: #333; }
        .tabs { display: flex; margin-bottom: 16px; border-bottom: 2px solid #eee; }
        .tabs button { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; cursor: pointer; color: #999; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.3s, border-color 0.3s; }
        .tabs button.active { color: #ee4d2d; border-bottom-color: #ee4d2d; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #ee4d2d; }
        .submit-btn { width: 100%; padding: 11px; background: #ee4d2d; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: background 0.3s; }
        .submit-btn:hover { background: #c93f1f; }
        .form-error { color: #ee4d2d; font-size: 13px; margin-top: 8px; text-align: center; display: none; }
        .detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 600; align-items: center; justify-content: center; }
        .detail-modal.active { display: flex; }
        .detail-box { background: #fff; border-radius: 12px; width: 560px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.18); position: relative; }
        .detail-box .detail-close { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.4); color: #fff; border: none; font-size: 20px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 1; }
        .detail-box .detail-close:hover { background: rgba(0,0,0,0.6); }
        .detail-img { width: 100%; height: 240px; display: flex; align-items: center; justify-content: center; font-size: 72px; color: #fff; }
        .detail-body { padding: 20px 24px 24px; }
        .detail-body h2 { font-size: 20px; margin-bottom: 6px; }
        .detail-price { color: #ee4d2d; font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .detail-price::before { content: 'NT$ '; font-size: 16px; }
        .detail-meta { display: flex; gap: 16px; font-size: 13px; color: #999; margin-bottom: 16px; }
        .detail-meta span { display: flex; align-items: center; gap: 4px; }
        .detail-meta .star { color: #f39c12; }
        .detail-desc { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 16px; padding: 12px 14px; background: #fafafa; border-radius: 6px; }
        .detail-add-btn { width: 100%; padding: 12px; background: #ee4d2d; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-bottom: 20px; }
        .detail-add-btn:hover { background: #c93f1f; }
        .review-section { border-top: 1px solid #eee; padding-top: 16px; }
        .review-section h3 { font-size: 15px; margin-bottom: 12px; }
        .review-item { padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .review-item:last-child { border-bottom: none; }
        .review-item .rev-user { font-size: 13px; font-weight: 600; color: #333; }
        .review-item .rev-star { color: #f39c12; font-size: 13px; }
        .review-item .rev-text { font-size: 13px; color: #666; margin-top: 3px; }
        .review-item .rev-date { font-size: 11px; color: #bbb; margin-top: 2px; }
        .review-empty { text-align: center; padding: 24px 0; color: #bbb; font-size: 13px; }
        .review-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .review-form select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; }
        .review-form input { flex: 1; min-width: 140px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; }
        .review-form input:focus { border-color: #ee4d2d; }
        .review-form button { padding: 8px 16px; background: #ee4d2d; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; transition: background 0.3s; white-space: nowrap; }
        .review-form button:hover { background: #c93f1f; }
        .toast { visibility: hidden; min-width: 200px; background: #333; color: #fff; text-align: center; border-radius: 6px; padding: 12px 20px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 700; opacity: 0; transition: opacity 0.4s, visibility 0.4s; }
        .toast.show { visibility: visible; opacity: 1; }
        @media (max-width: 620px) {
            .products { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .panel { width: 100%; right: -100%; }
            .header h1 { font-size: 16px; }
            .header h1 span { display: none; }
            .header-actions { gap: 4px; }
            .header-btn { padding: 6px 8px; font-size: 12px; }
            .lang-btn { font-size: 11px; padding: 3px 5px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <h1 id="storeTitle">Yulu 小舖 <span>｜全館免運中</span></h1>
        <div class="header-actions">
            <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
            <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
            <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日</button>
            <div id="userArea"></div>
            <button class="header-btn" onclick="openGame()" id="gameBtn">🎰 <span id="gameLabel">玩遊戲</span></button>
            <button class="header-btn" onclick="openSellerDashboard()" id="sellerCenterBtn">🏪 <span id="sellerCenterLabel">賣家中心</span></button>
            <button class="header-btn cart-btn" onclick="toggleCart()">
                🛒 <span id="cartLabel">購物車</span> <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </div>
</header>

<div class="container">
    <div class="banner">
        <h2 id="bannerTitle">🔥 初夏特賣．限時優惠</h2>
        <p id="bannerSub">全館滿 499 免運 ｜ 新會員現折 $50</p>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 搜尋商品名稱..." oninput="filterProducts()">
        <button class="search-icon" onclick="filterProducts()" id="searchBtn">搜尋</button>
    </div>
    <div class="search-info" id="searchInfo"></div>
    <div id="sellerFilterBar" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center"></div>

    <h3 class="section-title" id="sectionTitle">🛍️ 精選商品</h3>
    <div class="products" id="productList"></div>
</div>

<div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="panel" id="cartPanel">
    <div class="panel-header">
        <h2 id="cartPanelTitle">🛒 購物車</h2>
        <button class="panel-close" onclick="toggleCart()">&times;</button>
    </div>
    <div class="panel-body" id="cartItems"></div>
    <div class="panel-footer">
        <div class="coupon-area">
            <input type="text" id="couponInput" placeholder="輸入折價券代碼" maxlength="20">
            <button onclick="applyCoupon()" id="couponApplyBtn">套用</button>
        </div>
        <div id="couponStatus"></div>
        <div class="cart-total">
            <span id="cartSubtotalLabel">小計</span>
            <span id="cartSubtotal">NT$ 0</span>
        </div>
        <div class="cart-discount" id="cartDiscountRow" style="display:none">
            <span id="cartDiscountLabel">折價</span>
            <span id="cartDiscount">-NT$ 0</span>
        </div>
        <div class="cart-total">
            <span id="cartTotalLabel">總計</span>
            <span id="cartTotal">NT$ 0</span>
        </div>
        <button class="checkout-btn" onclick="checkout()" id="checkoutBtn">立即結帳</button>
    </div>
</div>

<div class="modal" id="authModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeAuth()">&times;</button>
        <h2 id="authTitle">👤 會員中心</h2>
        <div class="tabs">
            <button id="tabLogin" class="active" onclick="switchTab('login')">登入</button>
            <button id="tabRegister" onclick="switchTab('register')">註冊</button>
        </div>
        <div id="authForm"></div>
    </div>
</div>

<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
    <div class="detail-box">
        <button class="detail-close" onclick="closeDetail()">&times;</button>
        <div id="detailContent"></div>
    </div>
</div>

<div class="checkout-modal" id="checkoutModal" onclick="if(event.target===this)closeCheckout()">
    <div class="checkout-box">
        <button class="checkout-close" onclick="closeCheckout()">&times;</button>
        <div id="checkoutContent"></div>
    </div>
</div>

<div class="detail-modal" id="sellerModal" onclick="if(event.target===this)closeSellerDashboard()">
    <div class="detail-box" style="width:740px;max-width:94vw">
        <button class="detail-close" onclick="closeSellerDashboard()">&times;</button>
        <div id="sellerContent" style="min-height:300px"></div>
    </div>
</div>

<div class="detail-modal" id="orderHistoryModal" onclick="if(event.target===this)closeOrderHistory()">
    <div class="detail-box" style="width:640px;max-width:94vw">
        <button class="detail-close" onclick="closeOrderHistory()">&times;</button>
        <div id="orderHistoryContent" style="min-height:200px;padding:24px"></div>
    </div>
</div>

<div class="detail-modal" id="gameModal" onclick="if(event.target===this)closeGame()">
    <div class="detail-box" style="width:420px;max-width:92vw">
        <button class="detail-close" onclick="closeGame()">&times;</button>
        <div id="gameContent" style="min-height:260px"></div>
    </div>
</div>

    function t(key, vars) {
        let s = (langData[currentLang] && langData[currentLang][key]) || (langData.zh[key]) || key;
        if (vars) {
            for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
        }
        return s;
    }

    function pn(product, field) {
        const v = product[field];
        return v[currentLang] || v['zh'] || v;
    }

    function setLang(lang) {
        if (!langNames.includes(lang)) return;
        currentLang = lang;
        localStorage.setItem('store_lang', lang);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        applyLang();
    }

    function applyLang() {
        document.getElementById('storeTitle').innerHTML = t('title');
        document.getElementById('cartLabel').textContent = t('cart');
        document.getElementById('cartPanelTitle').textContent = t('cartPanel');
        document.getElementById('searchInput').placeholder = t('searchPlaceholder');
        document.getElementById('searchBtn').textContent = t('searchBtn');
        document.getElementById('sectionTitle').textContent = t('sectionTitle');
        document.getElementById('bannerTitle').textContent = t('bannerTitle');
        document.getElementById('bannerSub').textContent = t('bannerSub');
        document.getElementById('couponInput').placeholder = t('couponPlaceholder');
        document.getElementById('couponApplyBtn').textContent = t('couponApply');
        document.getElementById('cartSubtotalLabel').textContent = t('subtotal');
        document.getElementById('cartDiscountLabel').textContent = t('discount');
        document.getElementById('cartTotalLabel').textContent = t('total');
        document.getElementById('checkoutBtn').textContent = t('checkout');
        document.getElementById('authTitle').textContent = t('authTitle');
        document.getElementById('tabLogin').textContent = t('tabLogin');
        document.getElementById('tabRegister').textContent = t('tabRegister');
        const scLabel = document.getElementById('sellerCenterLabel');
        if (scLabel) scLabel.textContent = t('sellerCenter');
        const gameLabel = document.getElementById('gameLabel');
        if (gameLabel) gameLabel.textContent = t('playGame');

        renderUserArea();
        renderProducts();
        updateCart();
        if (document.getElementById('authModal').classList.contains('active')) {
            const activeTab = document.getElementById('tabLogin').classList.contains('active') ? 'login' : 'register';
            switchTab(activeTab);
        }
        if (document.getElementById('checkoutModal').classList.contains('active')) {
            renderCheckoutForm();
        }
    }

    function getUsers() {
        return JSON.parse(localStorage.getItem('store_users') || '{}');
    }
    function saveUsers(users) {
        localStorage.setItem('store_users', JSON.stringify(users));
    }
    function getSession() {
        return sessionStorage.getItem('store_session');
    }
    function setSession(email) {
        if (email) sessionStorage.setItem('store_session', email);
        else sessionStorage.removeItem('store_session');
    }

    function saveCart() {
        if (currentUser) {
            localStorage.setItem('store_cart_' + currentUser.email, JSON.stringify(cart));
        }
    }

    function loadCart() {
        if (currentUser) {
            const saved = localStorage.getItem('store_cart_' + currentUser.email);
            cart = saved ? JSON.parse(saved) : {};
        } else {
            cart = {};
        }
        updateCart();
    }

    function initAuth() {
        const email = getSession();
        if (email) {
            const users = getUsers();
            if (users[email]) {
                currentUser = users[email];
            } else {
                setSession(null);
            }
        }
        renderUserArea();
        loadCart();
        const savedGC = getGameCoupon();
        if (savedGC) appliedCoupon = savedGC;
        updateCart();
    }

    function renderUserArea() {
        const area = document.getElementById('userArea');
        if (currentUser) {
            area.innerHTML = `
                <div class="user-info">
                    <span class="avatar">${currentUser.name[0]}</span>
                    <span>${currentUser.name}${currentUser.isSeller ? '<span style="font-size:10px;background:#fdd835;color:#333;padding:1px 5px;border-radius:3px;margin-left:4px">🏪</span>' : ''}</span>
                    <button class="logout-btn" onclick="openOrderHistory()">📋</button>
                    <button class="logout-btn" onclick="logout()">${t('logout')}</button>
                </div>
            `;
        } else {
            area.innerHTML = `<button class="header-btn" onclick="openAuth()">${t('userMenu')}</button>`;
        }
    }

    function openAuth() {
        document.getElementById('authModal').classList.add('active');
        switchTab('login');
    }

    function closeAuth() {
        document.getElementById('authModal').classList.remove('active');
    }

    function switchTab(tab) {
        document.getElementById('tabLogin').className = tab === 'login' ? 'active' : '';
        document.getElementById('tabRegister').className = tab === 'register' ? 'active' : '';
        const form = document.getElementById('authForm');
        if (tab === 'login') {
            form.innerHTML = `
                <div class="form-group">
                    <label>${t('loginEmailLabel')}</label>
                    <input type="email" id="loginEmail" placeholder="${t('loginEmailPlaceholder')}">
                </div>
                <div class="form-group">
                    <label>${t('loginPwdLabel')}</label>
                    <input type="password" id="loginPwd" placeholder="${t('loginPwdPlaceholder')}">
                </div>
                <div class="form-error" id="loginError"></div>
                <button class="submit-btn" onclick="login()">${t('loginBtn')}</button>
            `;
        } else {
            form.innerHTML = `
                <div class="form-group">
                    <label>${t('regNameLabel')}</label>
                    <input type="text" id="regName" placeholder="${t('regNamePlaceholder')}">
                </div>
                <div class="form-group">
                    <label>${t('regEmailLabel')}</label>
                    <input type="email" id="regEmail" placeholder="${t('regEmailPlaceholder')}">
                </div>
                <div class="form-group">
                    <label>${t('regPwdLabel')}</label>
                    <input type="password" id="regPwd" placeholder="${t('regPwdPlaceholder')}">
                </div>
                <div class="form-error" id="regError"></div>
                <button class="submit-btn" onclick="register()">${t('regBtn')}</button>
            `;
        }
    }

    function register() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPwd').value;
        const err = document.getElementById('regError');

        if (!name || !email || !pwd) {
            err.textContent = t('fillAll'); err.style.display = 'block'; return;
        }
        if (pwd.length < 6) {
            err.textContent = t('pwdTooShort'); err.style.display = 'block'; return;
        }

        const users = getUsers();
        if (users[email]) {
            err.textContent = t('emailRegistered'); err.style.display = 'block'; return;
        }

        users[email] = { name, email, password: pwd };
        saveUsers(users);
        showToast(t('registerSuccess'));
        switchTab('login');
        document.getElementById('loginEmail').value = email;
    }

    function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPwd').value;
        const err = document.getElementById('loginError');

        if (!email || !pwd) {
            err.textContent = t('invalidEmailPwd'); err.style.display = 'block'; return;
        }

        const users = getUsers();
        const user = users[email];
        if (!user || user.password !== pwd) {
            err.textContent = t('wrongEmailPwd'); err.style.display = 'block'; return;
        }

        saveCart();
        currentUser = user;
        setSession(email);
        renderUserArea();
        loadCart();
        appliedCoupon = null;
        closeAuth();
        showToast(t('welcomeBack', { name: user.name }));
    }

    function logout() {
        saveCart();
        currentUser = null;
        setSession(null);
        cart = {};
        appliedCoupon = null;
        clearGameCoupon();
        renderUserArea();
        updateCart();
        showToast(t('loggedOut'));
    }

    function filterProducts() {
        const input = document.getElementById('searchInput');
        searchKeyword = input.value.trim().toLowerCase();
        renderProducts();
    }

    function getReviews(productId) {
        return JSON.parse(localStorage.getItem('store_reviews_' + productId) || '[]');
    }
    function saveReviews(productId, reviews) {
        localStorage.setItem('store_reviews_' + productId, JSON.stringify(reviews));
    }
    function getAvgRating(productId) {
        const reviews = getReviews(productId);
        if (reviews.length === 0) return 0;
        return (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
    }
    function ratingStars(n) {
        return '★'.repeat(Math.floor(n)) + '☆'.repeat(5 - Math.floor(n));
    }

    function openDetail(id) {
        document.getElementById('detailModal').classList.add('active');
        renderProductDetail(id);
    }
    function closeDetail() {
        document.getElementById('detailModal').classList.remove('active');
    }

    function renderProductDetail(id) {
        const p = getProductById(id);
        if (!p) return;
        const c = colors[(id * 7) % colors.length];
        const e = emojis[(id * 7) % emojis.length];
        const avg = getAvgRating(id);
        const reviews = getReviews(id);
        const pname = pn(p, 'name');
        const pdesc = pn(p, 'desc');
        const sellerDisplay = p.sellerEmail ? (p.sellerName || t('sellerNameLabel')) : t('officialStore');
        const dImgStyle = p.image ? `background-image:url('${p.image}');background-size:cover;background-position:center` : `background:${c}`;
        const dImgContent = p.image ? '' : e;

        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <div class="detail-img" style="${dImgStyle}">${dImgContent}</div>
            <div class="detail-body">
                <h2>${pname}</h2>
                <div style="font-size:13px;color:#888;margin-bottom:4px">${t('bySeller')} ${sellerDisplay}</div>
                <div class="detail-price">${p.price}</div>
                <div class="detail-meta">
                    <span>${t('soldPrefix')} ${((p.sold || 0) + getExtraSold(p.id)).toLocaleString()}</span>
                    <span class="star">${avg > 0 ? ratingStars(avg) + ' ' + avg : t('noRatingText')}</span>
                </div>
                <div class="detail-desc">${pdesc}</div>
                <button class="detail-add-btn" onclick="addToCart(${p.id}); closeDetail();">${t('detailAddCart')}</button>
                <div class="review-section">
                    <h3>${t('reviewTitle', { n: reviews.length })}</h3>
                    <div id="reviewList">
                        ${reviews.length === 0 ? '<div class="review-empty">' + t('reviewEmpty') + '</div>' :
                            reviews.map(r => `
                                <div class="review-item">
                                    <div><span class="rev-user">${r.name}</span> <span class="rev-star">${ratingStars(r.rating)}</span></div>
                                    <div class="rev-text">${r.text}</div>
                                    <div class="rev-date">${r.date}</div>
                                </div>
                            `).join('')
                        }
                    </div>
                    <div class="review-form">
                        <select id="reviewRating">
                            <option value="5">★★★★★ (5)</option>
                            <option value="4">★★★★☆ (4)</option>
                            <option value="3">★★★☆☆ (3)</option>
                            <option value="2">★★☆☆☆ (2)</option>
                            <option value="1">★☆☆☆☆ (1)</option>
                        </select>
                        <input type="text" id="reviewText" placeholder="${t('reviewPlaceholder')}">
                        <button onclick="submitReview(${id})">${t('reviewSubmit')}</button>
                    </div>
                </div>
            </div>
        `;
    }

    function submitReview(id) {
        if (!currentUser) {
            showToast(t('loginRequiredReview'));
            closeDetail();
            setTimeout(() => openAuth(), 400);
            return;
        }
        const rating = parseInt(document.getElementById('reviewRating').value);
        const text = document.getElementById('reviewText').value.trim();
        if (!text) { showToast(t('reviewInputRequired')); return; }

        const reviews = getReviews(id);
        const now = new Date();
        const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
        reviews.unshift({ name: currentUser.name, rating, text, date: dateStr });
        saveReviews(id, reviews);
        renderProductDetail(id);
        showToast(t('reviewSubmitted'));
    }

    function renderSellerFilterBar() {
        const bar = document.getElementById('sellerFilterBar');
        if (!bar) return;
        const sellers = getUniqueSellers();
        bar.innerHTML = `
            <button class="lang-btn ${sellerFilter === '' ? 'active' : ''}" onclick="setSellerFilter('')">${t('allProducts')}</button>
            <button class="lang-btn ${sellerFilter === 'official' ? 'active' : ''}" onclick="setSellerFilter('official')">${t('officialProducts')}</button>
            ${sellers.map(s => `
                <button class="lang-btn ${sellerFilter === s.email ? 'active' : ''}" onclick="setSellerFilter('${s.email}')">${s.name}</button>
            `).join('')}
        `;
    }

    function renderProducts() {
        const list = document.getElementById('productList');
        renderSellerFilterBar();

        let all = getAllProducts();
        if (sellerFilter === 'official') {
            all = all.filter(p => !p.sellerEmail);
        } else if (sellerFilter) {
            all = all.filter(p => p.sellerEmail === sellerFilter);
        }

        const kw = searchKeyword.toLowerCase();
        const filtered = kw
            ? all.filter(p => pn(p, 'name').toLowerCase().includes(kw))
            : all;

        const info = document.getElementById('searchInfo');
        if (searchKeyword) {
            info.textContent = t('searchResult', { q: document.getElementById('searchInput').value.trim(), n: filtered.length });
        } else {
            info.textContent = '';
        }

        if (filtered.length === 0) {
            list.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#bbb;font-size:15px">' + t('noResult') + '</div>';
            return;
        }

        list.innerHTML = filtered.map((p, idx) => {
            const c = colors[idx % colors.length];
            const e = emojis[idx % emojis.length];
            const avg = getAvgRating(p.id);
            const pname = pn(p, 'name');
            const sellerDisplay = p.sellerEmail ? (p.sellerName || t('sellerNameLabel')) : t('officialStore');
            const gImgStyle = p.image ? `background-image:url('${p.image}');background-size:cover;background-position:center` : `background:${c}`;
            const gImgContent = p.image ? '' : e;
            return `
                <div class="product-card" onclick="openDetail(${p.id})">
                    <div class="img-wrap" style="${gImgStyle}">${gImgContent}</div>
                    <div class="product-info">
                        <div class="product-name">${pname}</div>
                        <div class="product-price">${p.price}</div>
                        <div style="font-size:11px;color:#888;margin:1px 0">${t('bySeller')} ${sellerDisplay}</div>
                        <div class="product-sold">${t('soldPrefix')} ${((p.sold || 0) + getExtraSold(p.id)).toLocaleString()}</div>
                        ${avg > 0 ? '<div class="product-rating">' + ratingStars(avg) + ' ' + avg + '</div>' : ''}
                        <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">${t('addCart')}</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function addToCart(id) {
        cart[id] = (cart[id] || 0) + 1;
        updateCart();
        saveCart();
        showToast(t('addCartToast'));
    }

    function removeFromCart(id) {
        delete cart[id];
        updateCart();
        saveCart();
    }

    function changeQty(id, delta) {
        if (!cart[id]) return;
        cart[id] += delta;
        if (cart[id] <= 0) delete cart[id];
        updateCart();
        saveCart();
    }

    function getCartTotal() {
        const ids = Object.keys(cart);
        return ids.reduce((sum, idStr) => {
            const id = Number(idStr);
            const p = getProductById(id);
            return p ? sum + p.price * cart[id] : sum;
        }, 0);
    }

    function getDiscount() {
        if (!appliedCoupon) return 0;
        const total = getCartTotal();
        if (total < appliedCoupon.min) return 0;
        return appliedCoupon.discount;
    }

    function quickCoupon(code) {
        document.getElementById('couponInput').value = code;
        applyCoupon();
    }

    function applyCoupon() {
        const input = document.getElementById('couponInput');
        const code = input.value.trim().toUpperCase();
        if (!code) { showToast(t('couponEmpty')); return; }

        const found = coupons.find(c => c.code === code);
        if (!found) { showToast(t('couponInvalid')); return; }

        const total = getCartTotal();
        if (total < found.min) {
            showToast(t('couponMin', { n: found.min }));
            return;
        }

        appliedCoupon = found;
        input.value = '';
        updateCart();
        showToast(t('couponApplied', { desc: pn(found, 'desc') }));
    }

    function removeCoupon() {
        appliedCoupon = null;
        updateCart();
        showToast(t('couponRemoved'));
    }

    function updateCart() {
        const count = Object.values(cart).reduce((a, b) => a + b, 0);
        document.getElementById('cartCount').textContent = count;

        const itemsEl = document.getElementById('cartItems');
        const ids = Object.keys(cart);
        if (ids.length === 0) {
            itemsEl.innerHTML = '<div class="cart-empty">' + t('cartEmpty') + '</div>';
            appliedCoupon = null;
        } else {
            itemsEl.innerHTML = ids.map(idStr => {
                const id = Number(idStr);
                const p = getProductById(id);
                if (!p) return '';
                const qty = cart[id];
                const c = colors[(id * 3) % colors.length];
                const e = emojis[(id * 3) % emojis.length];
                const tImgStyle = p.image ? `background-image:url('${p.image}');background-size:cover;background-position:center` : `background:${c}`;
                const tImgContent = p.image ? '' : e;
                return `
                    <div class="cart-item">
                        <div class="thumb" style="${tImgStyle}">${tImgContent}</div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${pn(p, 'name')}</div>
                            <div class="cart-item-price">NT$ ${p.price}</div>
                            <div class="cart-item-qty">
                                <button onclick="changeQty(${id}, -1)">−</button>
                                <span>${qty}</span>
                                <button onclick="changeQty(${id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${id})">&times;</button>
                    </div>
                `;
            }).join('');
        }

        const subtotal = getCartTotal();
        const discount = getDiscount();
        const total = subtotal - discount;

        document.getElementById('cartSubtotal').textContent = 'NT$ ' + subtotal;

        const discountRow = document.getElementById('cartDiscountRow');
        const discountEl = document.getElementById('cartDiscount');
        if (discount > 0) {
            discountRow.style.display = 'flex';
            discountEl.textContent = '-NT$ ' + discount;
        } else {
            discountRow.style.display = 'none';
        }
        document.getElementById('cartTotal').textContent = 'NT$ ' + total;

        const couponStatus = document.getElementById('couponStatus');
        if (appliedCoupon) {
            const active = discount > 0;
            const desc = pn(appliedCoupon, 'desc');
            couponStatus.innerHTML = '<div class="coupon-applied"><span>' + (active ? '✅' : '⏳') + ' ' + desc + (active ? '' : ' ' + t('couponBelowMin')) + '</span><button onclick="removeCoupon()">' + t('couponRemove') + '</button></div>';
        } else if (ids.length > 0) {
            couponStatus.innerHTML = '<div style="font-size:12px;color:#999;margin-bottom:8px">' + t('couponHint') + coupons.map(c => '<span style="cursor:pointer;color:#ee4d2d;font-weight:600;text-decoration:underline" onclick="quickCoupon(\'' + c.code + '\')">' + c.code + '</span>').join(' / ') + '</div>';
        } else {
            couponStatus.innerHTML = '';
        }
    }

    function toggleCart() {
        document.getElementById('cartOverlay').classList.toggle('active');
        document.getElementById('cartPanel').classList.toggle('open');
    }

    function openCheckout() {
        document.getElementById('checkoutModal').classList.add('active');
        renderCheckoutForm();
    }

    function closeCheckout() {
        document.getElementById('checkoutModal').classList.remove('active');
    }

    function renderCheckoutForm() {
        const ids = Object.keys(cart);
        const subtotal = getCartTotal();
        const discount = getDiscount();
        const total = subtotal - discount;
        const count = ids.reduce((s, id) => s + cart[id], 0);
        const ship = 0;

        const payMethods = [
            { value: 'cc', label: t('payCCLabel'), display: t('payCC') },
            { value: 'atm', label: t('payATMLabel'), display: t('payATM') },
            { value: 'cod', label: t('payCODLabel'), display: t('payCOD') },
        ];

        const el = document.getElementById('checkoutContent');
        el.innerHTML = `
            <h2>${t('checkoutTitle')}</h2>
            <div class="checkout-layout">
                <div class="checkout-left">
                    <h3>📦 ${t('shipRecipient')}</h3>
                    <div class="checkout-row">
                        <div class="form-group">
                            <label>${t('shipRecipient')}</label>
                            <input type="text" id="shipName" value="${currentUser ? currentUser.name : ''}" placeholder="${t('shipRecipientPlaceholder')}">
                        </div>
                        <div class="form-group">
                            <label>${t('shipPhone')}</label>
                            <input type="tel" id="shipPhone" placeholder="${t('shipPhonePlaceholder')}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>${t('shipAddress')}</label>
                        <input type="text" id="shipAddress" placeholder="${t('shipAddressPlaceholder')}">
                    </div>
                    <h3>💳 ${t('paymentMethod')}</h3>
                    <div class="payment-options" onchange="toggleCardFields()">
                        ${payMethods.map((m, i) => `
                            <label>
                                <input type="radio" name="payment" value="${m.value}" ${i === 0 ? 'checked' : ''}>
                                <span>${m.display}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div class="card-fields" id="cardFields">
                        <div class="card-row">
                            <div class="form-group" style="flex:2">
                                <label>信用卡號</label>
                                <input type="text" id="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456" oninput="formatCardNumber(this)">
                            </div>
                        </div>
                        <div class="card-row">
                            <div class="form-group">
                                <label>有效月年</label>
                                <input type="text" id="cardExpiry" maxlength="7" placeholder="MM / YY">
                            </div>
                            <div class="form-group">
                                <label>安全碼 (CVV)</label>
                                <input type="text" id="cardCvv" maxlength="4" placeholder="123">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="checkout-right">
                    <div class="checkout-summary">
                        <div class="cs-items">${t('orderItems', { n: count })}</div>
                        ${ids.map(idStr => {
                            const id = Number(idStr);
                            const p = getProductById(id);
                            if (!p) return '';
                            const qty = cart[id];
                            const sellerTag = p.sellerEmail ? ' <span style="font-size:11px;color:#999">[' + (p.sellerName || '') + ']</span>' : '';
                            return '<div class="cs-row"><span>' + pn(p, 'name') + sellerTag + ' × ' + qty + '</span><span>NT$ ' + (p.price * qty) + '</span></div>';
                        }).join('')}
                        <div class="cs-row">${t('orderSubtotal')}<span>NT$ ${subtotal}</span></div>
                        ${discount > 0 ? '<div class="cs-row cs-discount">' + t('orderDiscount') + '<span>-NT$ ' + discount + '</span></div>' : ''}
                        <div class="cs-row">${t('orderShipping')}<span>${ship === 0 ? t('orderFree') : 'NT$ ' + ship}</span></div>
                        <div class="cs-row cs-total">${t('orderTotal')}<span>NT$ ${total}</span></div>
                    </div>
                    <button class="place-order-btn" onclick="placeOrder()">${t('placeOrder')}</button>
                </div>
            </div>
        `;
        toggleCardFields();
    }

    function toggleCardFields() {
        const cc = document.querySelector('input[name="payment"]:checked')?.value === 'cc';
        document.getElementById('cardFields').classList.toggle('show', cc);
    }

    function formatCardNumber(el) {
        let v = el.value.replace(/\D/g, '').substring(0, 16);

    function placeOrder() {
        const name = document.getElementById('shipName').value.trim();
        const phone = document.getElementById('shipPhone').value.trim();
        const address = document.getElementById('shipAddress').value.trim();
        const payment = document.querySelector('input[name="payment"]:checked');

        if (!name || !phone || !address) {
            showToast(t('fillAll')); return;
        }
        if (!payment) { showToast(t('fillAll')); return; }

        if (payment.value === 'cc') {
            const cn = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const exp = document.getElementById('cardExpiry').value.trim();
            const cvv = document.getElementById('cardCvv').value.trim();
            if (cn.length < 13 || cn.length > 16) { showToast('請輸入有效的信用卡號'); return; }
            if (!/^\d{2}\s*\/\s*\d{2}$/.test(exp)) { showToast('請輸入有效月年 (MM/YY)'); return; }
            if (cvv.length < 3) { showToast('請輸入安全碼'); return; }
        }

        const payLabel = payment.value === 'cc' ? t('payCC') : payment.value === 'atm' ? t('payATM') : t('payCOD');
        const ids = Object.keys(cart);
        const subtotal = getCartTotal();
        const discount = getDiscount();
        const total = subtotal - discount;
        const count = ids.reduce((s, id) => s + cart[id], 0);
        const orderId = Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2, 4).toUpperCase();

        const cardInfo = payment.value === 'cc' ? {
            last4: document.getElementById('cardNumber').value.replace(/\s/g, '').slice(-4),
            expiry: document.getElementById('cardExpiry').value.trim(),
        } : null;

        const order = {
            id: orderId,
            date: new Date().toISOString(),
            items: ids.map(idStr => {
                const id = Number(idStr);
                const p = getProductById(id);
                return { id, name: pn(p, 'name'), price: p.price, qty: cart[id], sellerEmail: p.sellerEmail, sellerName: p.sellerName, status: 'pending' };
            }),
            subtotal, discount, total, shipping: 0,
            recipient: name, phone, address,
            payment: payLabel, cardInfo,
        };

        const orders = JSON.parse(localStorage.getItem('store_orders_' + currentUser.email) || '[]');
        orders.unshift(order);
        localStorage.setItem('store_orders_' + currentUser.email, JSON.stringify(orders));

        const content = document.getElementById('checkoutContent');
        content.innerHTML = `
            <div class="order-confirm">
                <div class="oc-icon">🎉</div>
                <h2>${t('confirmTitle')}</h2>
                <p>${t('confirmMsg')}</p>
                <div class="oc-details">
                    ${t('confirmNum', { n: orderId })}<br>
                    ${t('confirmShip', { addr: address })}<br>
                    ${t('confirmPay', { pay: payLabel })}${cardInfo ? '<br>💳 **** ' + cardInfo.last4 + ' (' + cardInfo.expiry + ')' : ''}<br>
                    ${t('orderTotal')}：NT$ ${total}
                </div>
                <button class="oc-btn" onclick="closeCheckout(); clearCartAfterOrder()">${t('confirmBack')}</button>
            </div>
        `;
    }

    function checkout() {
        if (!currentUser) {
            showToast(t('loginRequired'));
            closeAuth();
            setTimeout(() => openAuth(), 300);
            return;
        }
        const count = Object.values(cart).reduce((a, b) => a + b, 0);

        toggleCart();

    function hideSellerProductForm() {
        const form = document.getElementById('sellerProductForm');
        if (form) form.remove();
        editingProductId = null;
    }
    function saveSellerProductForm() {
        const name = document.getElementById('sellerFormName').value.trim();
        const price = parseInt(document.getElementById('sellerFormPrice').value);
        const desc = document.getElementById('sellerFormDesc').value.trim();
        const sold = parseInt(document.getElementById('sellerFormSold').value) || 0;
        const image = document.getElementById('sellerFormImageData').value || null;
        if (!name || !price || !desc) {
            showToast(t('fillAll')); return;
        }
        const all = getSellerProducts();
        if (editingProductId) {
            const idx = all.findIndex(p => p.id === editingProductId && p.sellerEmail === currentUser.email);
            if (idx >= 0) {
                all[idx].name = name;
                all[idx].price = price;
                all[idx].desc = desc;
                all[idx].sold = sold;
                all[idx].image = image;
            }
        } else {
            const maxId = all.reduce((m, p) => Math.max(m, p.id), 999);
            all.push({
                id: maxId + 1, name, price, desc, sold: sold || 0,
                sellerEmail: currentUser.email,
                sellerName: currentUser.name,
                image,
                _colorIdx: (all.length + 7) % colors.length,
                _emoji: emojis[(all.length + 7) % emojis.length],
            });
        }
        saveSellerProducts(all);
        hideSellerProductForm();
        renderSellerProductList();
        renderProducts();
        showToast(t('productSaved'));
    }
    function deleteSellerProduct(id) {
        if (!confirm(t('confirmDeleteProduct'))) return;
        const all = getSellerProducts().filter(p => !(p.id === id && p.sellerEmail === currentUser.email));
        saveSellerProducts(all);
        renderSellerProductList();
        renderProducts();
        showToast(t('productDeleted'));
    }
    function getSellerOrders() {
        const users = getUsers();
        const allOrders = [];
        for (const email in users) {
            const orders = JSON.parse(localStorage.getItem('store_orders_' + email) || '[]');
            orders.forEach(o => {
                const sellerItems = o.items.filter(item => {
                    return getSellerProducts().some(sp => sp.id === item.id && sp.sellerEmail === currentUser.email);
                });
                if (sellerItems.length > 0) {
                    allOrders.push({ ...o, buyerEmail: email, buyerName: users[email].name, sellerItems });
                }
            });
        }
        return allOrders.sort((a, b) => new Date(b.date) - new Date(a.date));
    }
    function shipOrder(orderId, buyerEmail, itemId) {
        const orders = JSON.parse(localStorage.getItem('store_orders_' + buyerEmail) || '[]');
        const order = orders.find(o => o.id === orderId);
        if (order) {
            const item = order.items.find(i => i.id === itemId);
            if (item) item.status = 'shipped';
            localStorage.setItem('store_orders_' + buyerEmail, JSON.stringify(orders));
        }
        renderSellerTabContent();
        showToast(t('shipSuccess'));
    }

        localStorage.setItem('store_extra_sold', JSON.stringify(data));

    function completeOrderItem(orderId, itemId, orderIdx) {
        const orders = JSON.parse(localStorage.getItem('store_orders_' + currentUser.email) || '[]');
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        const item = order.items.find(i => i.id === itemId);
        if (!item) return;
        if (item.status !== 'shipped') return;
        const product = getProductById(itemId);
        if (!product) return;
        const pname = pn(product, 'name');
        const el = document.getElementById('orderHistoryContent');
        const reviewDiv = document.createElement('div');
        reviewDiv.id = 'reviewInline_' + itemId;
        reviewDiv.style.cssText = 'background:#fff;border:1px solid #eee;border-radius:6px;padding:12px;margin:8px 0';
        reviewDiv.innerHTML = `
            <div style="font-size:14px;font-weight:600;margin-bottom:8px">📝 ${t('reviewTitle', { n: 0 })} — ${pname}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <select id="reviewRating_${itemId}" style="padding:6px;border:1px solid #ddd;border-radius:4px;font-size:13px">
                    <option value="5">★★★★★ (5)</option>
                    <option value="4">★★★★☆ (4)</option>
                    <option value="3">★★★☆☆ (3)</option>
                    <option value="2">★★☆☆☆ (2)</option>
                    <option value="1">★☆☆☆☆ (1)</option>
                </select>

                <button onclick="submitOrderReview('${orderId}',${itemId},${item.qty})" style="padding:7px 16px;background:#ee4d2d;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px">${t('reviewSubmit')}</button>
                <button onclick="cancelOrderReview(${itemId})" style="padding:7px 12px;background:#f0f0f0;color:#333;border:none;border-radius:4px;cursor:pointer;font-size:13px">${t('cancel')}</button>
            </div>
        `;

    function cancelOrderReview(itemId) {
        const el = document.getElementById('reviewInline_' + itemId);
        if (el) el.remove();
    }
    function submitOrderReview(orderId, itemId, qty) {
        const rating = parseInt(document.getElementById('reviewRating_' + itemId).value);
        const text = document.getElementById('reviewText_' + itemId).value.trim();
        if (!text) { showToast(t('reviewInputRequired')); return; }
        const orders = JSON.parse(localStorage.getItem('store_orders_' + currentUser.email) || '[]');
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        const item = order.items.find(i => i.id === itemId);
        if (!item) return;
        item.status = 'completed';
        localStorage.setItem('store_orders_' + currentUser.email, JSON.stringify(orders));
        const product = getProductById(itemId);
        if (product) {
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            const reviews = JSON.parse(localStorage.getItem('store_reviews_' + itemId) || '[]');
            reviews.unshift({ name: currentUser.name, rating, text, date: dateStr });
            localStorage.setItem('store_reviews_' + itemId, JSON.stringify(reviews));
            const sp = getSellerProducts();
            const sellerProd = sp.find(p => p.id === itemId);
            if (sellerProd) {
                sellerProd.sold = (sellerProd.sold || 0) + qty;
                saveSellerProducts(sp);
            } else {
                addExtraSold(itemId, qty);
            }
        }
        cancelOrderReview(itemId);
        renderOrderHistory();
        renderProducts();
        renderSellerProductList();
        showToast(t('reviewSubmitted'));
    }
    function renderOrderHistory() {
        const el = document.getElementById('orderHistoryContent');
        if (!currentUser) { el.innerHTML = '<p style="text-align:center;color:#888;padding:40px 0">' + t('loginRequired') + '</p>'; return; }
        const orders = JSON.parse(localStorage.getItem('store_orders_' + currentUser.email) || '[]');
        if (orders.length === 0) {
            el.innerHTML = '<div style="text-align:center;padding:60px 0;color:#bbb;font-size:15px">' + t('noOrders') + '</div>';
            return;
        }
        el.innerHTML = '<h2 style="font-size:20px;margin-bottom:16px">' + t('myOrders') + '</h2>' +
            orders.map((o, oi) => {
                const ts = new Date(o.date);
                const hasCompletable = o.items.some(i => i.status === 'shipped');
                return `
                    <div style="background:#fafafa;border-radius:8px;padding:14px 16px;margin-bottom:6px" data-order-idx="${oi}">
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                            <span style="font-size:12px;font-weight:600">${o.id}</span>
                            <span style="font-size:12px;color:#bbb">${ts.toLocaleDateString()} ${ts.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                        </div>
                        ${o.items.map(item => {
                            const shipped = item.status === 'shipped';
                            const completed = item.status === 'completed';
                            const sellerTag = item.sellerName ? '<span style="font-size:11px;color:#999"> [' + item.sellerName + ']</span>' : '';
                            let statusHtml;
                            if (completed) {
                                statusHtml = '<span style="font-size:11px;padding:2px 6px;border-radius:3px;background:#e8f5e9;color:#2e7d32">' + t('statusCompleted') + '</span>';
                            } else if (shipped) {
                                statusHtml = '<span style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;padding:2px 6px;border-radius:3px;background:#e3f2fd;color:#1565c0">' + t('statusShipped') + '</span><button onclick="completeOrderItem(\'' + o.id + '\',' + item.id + ',' + oi + ')" style="padding:3px 8px;background:#27ae60;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;white-space:nowrap">' + t('completeOrder') + '</button></span>';
                            } else {
                                statusHtml = '<span style="font-size:11px;padding:2px 6px;border-radius:3px;background:#fff8e1;color:#f57f17">' + t('statusPending') + '</span>';
                            }
                            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0f0f0">
                                <div style="font-size:13px">${item.name}${sellerTag} × ${item.qty}</div>
                                <div style="display:flex;align-items:center;gap:8px">
                                    <span style="font-size:13px;color:#ee4d2d">NT$${item.price * item.qty}</span>
                                    ${statusHtml}
                                </div>
                            </div>`;
                        }).join('')}
                        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:6px">
                            <span>📍 ${o.address}</span>
                            <span>💳 ${o.payment}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#ee4d2d;margin-top:4px;padding-top:6px;border-top:1px solid #eee">
                            <span>${t('orderTotal')}</span>
                            <span>NT$ ${o.total}</span>
                        </div>
                    </div>
                `;
            }).join('');
    }

    // --- Mini Game ---
    const gameSlots = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣'];
    const gameCoupons = [
        { code: 'LUCKY30', discount: 30, desc: { zh: '🎰 $30', en: '🎰 $30', ja: '🎰 $30' }, min: 100 },
        { code: 'GAME50', discount: 50, desc: { zh: '🎰 $50', en: '🎰 $50', ja: '🎰 $50' }, min: 200 },
        { code: 'JACKPOT', discount: 100, desc: { zh: '🎰 $100', en: '🎰 $100', ja: '🎰 $100' }, min: 400 },
    ];
    function getGameCoupon() {
        if (!currentUser) return null;
        const d = localStorage.getItem('store_game_coupon_' + currentUser.email);
        return d ? JSON.parse(d) : null;
    }
    function saveGameCoupon(c) {
        if (currentUser) localStorage.setItem('store_game_coupon_' + currentUser.email, JSON.stringify(c));
    }
    function clearGameCoupon() {
        if (currentUser) localStorage.removeItem('store_game_coupon_' + currentUser.email);
    }
    function openGame() {
        if (!currentUser) { showToast(t('loginRequired')); setTimeout(() => openAuth(), 300); return; }
        document.getElementById('gameModal').classList.add('active');
        renderGame();
    }
    function closeGame() { document.getElementById('gameModal').classList.remove('active'); }
    function canPlayGame() {
        if (!currentUser) return false;
        const key = 'store_game_play_' + currentUser.email;
        return localStorage.getItem(key) !== new Date().toDateString();
    }
    function renderGame() {
        const el = document.getElementById('gameContent');
        const canPlay = canPlayGame();
        const won = getGameCoupon();
        el.innerHTML = `
            <div style="text-align:center;padding:30px 20px">
                <h2 style="font-size:22px;margin-bottom:4px">🎰 ${t('gameTitle')}</h2>
                <p style="font-size:13px;color:#888;margin-bottom:16px">${t('comeTomorrow')}</p>
                <div id="gameSlots" style="display:flex;justify-content:center;gap:12px;margin-bottom:20px">
                    ${['🍒', '🍒', '🍒'].map(s => `
                        <div class="game-slot" style="width:76px;height:76px;background:#f5f5f5;border:3px solid #ddd;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px">${s}</div>
                    `).join('')}
                </div>
                ${won ? '<div style="font-size:15px;color:#27ae60;margin-bottom:10px">✅ ' + t('couponAutoApplied') + ': <strong>' + won.code + '</strong></div>' : ''}
                ${canPlay && !won ? `<button id="spinBtn" class="submit-btn" onclick="spinGame()" style="width:auto;padding:12px 40px;font-size:16px">${t('spin')}</button>` : (!won ? '<div style="color:#bbb;font-size:14px;padding:12px">' + t('playedToday') + '</div>' : '')}
                <div id="gameResult" style="margin-top:12px;min-height:30px"></div>
            </div>
        `;
    }
    function spinGame() {
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.textContent = t('spinning');
        const slots = document.querySelectorAll('.game-slot');
        const interval = setInterval(() => {
            slots.forEach(s => { s.textContent = gameSlots[Math.floor(Math.random() * gameSlots.length)]; });
        }, 70);
        setTimeout(() => {
            clearInterval(interval);
            const results = [];
            slots.forEach(s => {
                const v = gameSlots[Math.floor(Math.random() * gameSlots.length)];
                s.textContent = v;
                results.push(v);
            });
            const key = 'store_game_play_' + currentUser.email;
            localStorage.setItem(key, new Date().toDateString());
            const win = results.every(r => r === results[0]);
            const resultEl = document.getElementById('gameResult');
            if (win) {
                const coupon = gameCoupons[Math.floor(Math.random() * gameCoupons.length)];
                saveGameCoupon(coupon);
                appliedCoupon = coupon;
                updateCart();
                btn.remove();
                resultEl.innerHTML = `
                    <div style="font-size:22px;font-weight:700;color:#ee4d2d;margin-bottom:6px">🎉 ${t('youWin')}</div>
                    <div style="font-size:16px;color:#27ae60;font-weight:600">${t('winCoupon', { code: coupon.code, discount: coupon.discount })}</div>
                    <div style="font-size:13px;color:#888;margin-top:8px;background:#fff8e1;padding:8px 12px;border-radius:6px">${t('couponAutoApplied')} 🛒</div>
                `;
            } else {
                btn.disabled = true;
                btn.textContent = t('tryAgain');
                btn.style.display = 'none';
                resultEl.innerHTML = '<div style="font-size:18px;color:#888">😅 ' + t('tryAgain') + '</div><div style="font-size:13px;color:#bbb;margin-top:4px">' + t('comeTomorrow') + '</div>';
            }
        }, 1500);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    initAuth();
    renderProducts();
    applyLang();
</script>
</body>
</html>
